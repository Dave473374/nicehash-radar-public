name: Public On-chain HIT Research

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - scripts/backfill_public_easymining_hits.py
      - scripts/verify_onchain_hits.py
      - tests/test_public_hit_backfill.py
      - tests/test_onchain_hit_verification.py
      - docs/onchain-hit-verification.md
      - .github/workflows/onchain-hit-research.yml

concurrency:
  group: onchain-hit-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety guards
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
      - name: Unit tests without network
        run: |
          python3 -m unittest tests.test_public_hit_backfill tests.test_onchain_hit_verification -v
      - name: Public network smoke (no credentials, no writes)
        run: |
          python3 scripts/backfill_public_easymining_hits.py --max-pages 2 --output /tmp/public-easymining-hit-history.jsonl
          python3 scripts/verify_onchain_hits.py \
            --input /tmp/public-easymining-hit-history.jsonl \
            --ledger /tmp/onchain-hit-verification.jsonl \
            --report /tmp/onchain-hit-report.json \
            --max-new 6
          cat /tmp/onchain-hit-report.json

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: onchain-hit-research-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck safety guards
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
      - name: Extend public success-event history and verify new BTC/BCH events
        run: |
          python3 scripts/backfill_public_easymining_hits.py --max-pages 20
          python3 scripts/verify_onchain_hits.py --max-new 25
      - name: Persist research-only outputs
        run: |
          git config user.name 'NiceHash Radar Bot'
          git config user.email 'actions@github.com'
          git add research/public-easymining-hit-history.jsonl research/onchain-hit-verification.jsonl research/onchain-hit-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update public on-chain HIT research (no decision changes)'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
