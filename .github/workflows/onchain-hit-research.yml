name: Public On-chain HIT Research

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - scripts/collect_realized_blocks.py
      - scripts/backfill_public_easymining_hits.py
      - scripts/verify_onchain_hits.py
      - tests/test_public_hit_backfill.py
      - tests/test_onchain_hit_verification.py
      - docs/onchain-hit-verification.md
      - .github/workflows/onchain-hit-research.yml

concurrency:
  group: onchain-hit-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety guards
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
      - name: Unit tests without network
        run: |
          python3 -m unittest tests.test_public_hit_backfill tests.test_onchain_hit_verification -v
      - name: Bounded public BCH provider diagnosis
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, urllib.error
          sys.path.insert(0, 'scripts')
          import verify_onchain_hits as v
          h = '000000000000000000661729e061860fc71d945b3adc7b91ebb211dcdf3abc8e'
          urls = (
              'https://bchexplorer.cash/api/block-height/969090',
              'https://api.blockchair.com/bitcoin-cash/dashboards/block/969090',
              'https://bchexplorer.info/api/bch/block/' + h,
          )
          safe_keys = {'id','hash','height','blockhash','blockHash','time','timestamp','difficulty','reward','generation','code','error','message','confirmations','coinbase_data_hex'}
          def summary(value, depth=0):
              if isinstance(value, dict):
                  out = {'keys': list(value)[:35]}
                  for k, val in value.items():
                      if k in safe_keys and not isinstance(val, (dict,list)):
                          out[k] = str(val)[:250]
                      elif depth < 2 and isinstance(val, dict):
                          out[k] = summary(val, depth+1)
                      elif isinstance(val, list):
                          out[k] = {'length': len(val), 'firstType': type(val[0]).__name__ if val else None}
                  return out
              return {'type':type(value).__name__}
          for url in urls:
              try:
                  req = urllib.request.Request(url, method='GET', headers={'User-Agent':'NiceHash-Radar-Public-BCH-Diagnostic/1.0','Accept':'application/json,text/plain'})
                  with urllib.request.build_opener(v.NoRedirect()).open(req, timeout=20) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise ValueError('Unexpected response or redirect')
                      raw = response.read(4_000_001)
                  if len(raw)>4_000_000: raise ValueError('Oversized response')
                  try: obj=json.loads(raw)
                  except ValueError: obj=None
                  print(json.dumps({'url':url,'status':200,'bytes':len(raw),'summary':summary(obj),'textHashMatch':raw.strip().decode('utf-8')==h},sort_keys=True))
              except urllib.error.HTTPError as e:
                  print(json.dumps({'url':url,'httpStatus':e.code,'errorType':type(e).__name__}))
              except Exception as e:
                  print(json.dumps({'url':url,'errorType':type(e).__name__}))
          print('PUBLIC DIAGNOSIS ONLY; no credentials, no changes, no verification claim')
          PY
      - name: Small public-network smoke
        run: |
          python3 scripts/collect_realized_blocks.py --pages 2 --output /tmp/realized-blocks.jsonl
          python3 scripts/backfill_public_easymining_hits.py \
            --input /tmp/realized-blocks.jsonl \
            --output /tmp/public-easymining-hit-history.jsonl
          python3 scripts/verify_onchain_hits.py \
            --input /tmp/public-easymining-hit-history.jsonl \
            --ledger /tmp/onchain-hit-verification.jsonl \
            --report /tmp/onchain-hit-report.json \
            --max-new 8
          cat /tmp/onchain-hit-report.json

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: onchain-hit-research-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck safety guards
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
      - name: Deep public success-event snapshot and balanced on-chain verification
        run: |
          python3 scripts/collect_realized_blocks.py --pages 50 --output /tmp/deep-realized-blocks.jsonl
          python3 scripts/backfill_public_easymining_hits.py \
            --input /tmp/deep-realized-blocks.jsonl \
            --output research/public-easymining-hit-history.jsonl
          python3 scripts/verify_onchain_hits.py --max-new 24
      - name: Persist research-only outputs
        run: |
          git config user.name 'NiceHash Radar Bot'
          git config user.email 'actions@github.com'
          git add research/public-easymining-hit-history.jsonl research/onchain-hit-verification.jsonl research/onchain-hit-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update public on-chain HIT research (no decision changes)'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          done
          exit 1
