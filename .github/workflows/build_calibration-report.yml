{
"name": "Build Calibration Report",
"on": {
"workflow_dispatch": {},
"schedule": [
{
"cron": "12,27,42,57 * * * *"
}
]
},
"permissions": {
"contents": "write"
},
"jobs": {
"report": {
"runs-on": "ubuntu-latest",
"steps": [
{
"uses": "actions/checkout@v4"
},
{
"uses": "actions/setup-python@v5",
"with": {
"python-version": "3.12"
}
},
{
"name": "Build calibration report",
"run": "python scripts/build_calibration_report.py"
},
{
"name": "Commit calibration report",
"run": "git config user.name \"github-actions[bot]\" && git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\" && git add calibration/calibration-report.json && git diff --cached --quiet || (git commit -m \"Update Calibration Report\" && git push)"
}
]
}
}
}
