{"name":"Build Calibration Report","on":{"workflow_dispatch":{},"schedule":[{"cron":"12,27,42,57 * * * *"}]},"permissions":{"contents":"write"},"concurrency":{"group":"build-calibration-report","cancel-in-progress":false},"jobs":{"report":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Build calibration report","run":"python scripts/build_calibration_report.py"},{"name":"Commit calibration report","run":"git config user.name \"github-actions[bot]\"; git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"; git add calibration/calibration-report.json; if git diff --cached --quiet; then echo \"No calibration report changes\"; exit 0; fi; git commit -m \"Update Calibration Report\"; for attempt in 1 2 3; do if git push; then exit 0; fi; echo \"Push race detected; rebasing on latest main (attempt $attempt/3)\"; git fetch origin main; if ! git rebase origin/main; then echo \"Rebase conflict detected; refusing to overwrite remote changes\"; git rebase --abort || true; exit 1; fi; sleep $((attempt * 2)); done; echo \"Push failed after 3 safe retries\"; exit 1"}]}}}