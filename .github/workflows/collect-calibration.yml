{"name":"Collect Radar Calibration","on":{"workflow_dispatch":{},"schedule":[{"cron":"7,37 * * * *"}]},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.x"}},{"run":"pip install requests"},{"name":"Fetch private EasyMining history","run":"python3 scripts/collect_completed_orders.py","env":{"NICEHASH_API_KEY":"${{ secrets.NICEHASH_API_KEY }}","NICEHASH_API_SECRET":"${{ secrets.NICEHASH_API_SECRET }}","NICEHASH_ORG_ID":"${{ secrets.NICEHASH_ORG_ID }}"}},{"name":"Create calibration snapshot","run":"python3 scripts/collect_calibration.py"},{"name":"Verify private history","run":"python3 -c \"import json; d=json.load(open('/tmp/nicehash-completed-orders.json')); print('Completed orders available to calibration:',len(d.get('list',[])))\""},{"name":"Save calibration snapshot","run":"git config user.name \"NiceHash Radar Bot\"; git config user.email \"actions@github.com\"; git add calibration/radar-snapshots.jsonl; if git diff --cached --quiet; then echo \"No calibration changes\"; else git commit -m \"Update radar calibration history\"; git push; fi"}]}}}
