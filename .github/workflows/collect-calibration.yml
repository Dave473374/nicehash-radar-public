{"name":"Collect Radar Calibration","on":{"workflow_dispatch":{},"schedule":[{"cron":"7,37 * * * *"}]},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.x"}},{"name":"Backfill missing Radar snapshots from buy-feed history","run":"python3 scripts/backfill_radar_snapshots.py"},{"name":"Create current calibration snapshot","run":"python3 scripts/collect_calibration.py"},{"name":"Save calibration snapshots","run":"git config user.name \"NiceHash Radar Bot\"; git config user.email \"actions@github.com\"; git add calibration/radar-snapshots.jsonl; if git diff --cached --quiet; then echo \"No calibration changes\"; else git commit -m \"Update radar calibration history\"; git push; fi"},{"run":"pip install requests"},{"name":"Fetch private EasyMining history","run":"python3 scripts/collect_completed_orders.py","env":{"NICEHASH_API_KEY":"${{ secrets.NICEHASH_API_KEY }}","NICEHASH_API_SECRET":"${{ secrets.NICEHASH_API_SECRET }}","NICEHASH_ORG_ID":"${{ secrets.NICEHASH_ORG_ID }}"}},{"name":"Match private orders to Radar","run":"python3 scripts/match_private_orders.py"}]}}}
