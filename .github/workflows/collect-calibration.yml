{"name":"Collect Radar Calibration","on":{"workflow_dispatch":{},"schedule":[{"cron":"7,37 * * * *"}]},"permissions":{"contents":"write"},"concurrency":{"group":"radar-calibration","cancel-in-progress":false},"jobs":{"collect":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.x"}},{"name":"Backfill missing Radar snapshots from buy-feed history","run":"python3 scripts/backfill_radar_snapshots.py"},{"name":"Create current calibration snapshot","run":"python3 scripts/collect_calibration.py"},{"name":"Save calibration snapshots","run":"git config user.name \"NiceHash Radar Bot\"; git config user.email \"actions@github.com\"; git add calibration/radar-snapshots.jsonl; if git diff --cached --quiet; then echo \"No calibration changes\"; else git commit -m \"Update radar calibration history\"; for attempt in 1 2 3; do if git push; then exit 0; fi; echo \"Push race detected; rebasing on latest main (attempt $attempt/3)\"; git fetch origin main; git rebase origin/main || exit 1; done; echo \"Push failed after 3 safe retries\"; exit 1; fi"}]}}}