name: Collect Radar Calibration

on:
workflow_dispatch:
schedule:
- cron: '7,37 * * * *'

permissions:
contents: write

jobs:
collect:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.12'

- name: Collect calibration snapshot
run: python scripts/collect_calibration.py

- name: Commit calibration data
shell: bash
run: |
git config user.name "NiceHash Radar Bot"
git config user.email "actions@github.com"
git add calibration/
git diff --cached --quiet || git commit -m "Update radar calibration history"
git push
