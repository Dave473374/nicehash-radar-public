{"name":"Test NiceHash Private API","on":{"workflow_dispatch":{}},"jobs":{"test":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.x"}},{"run":"pip install requests"},{"name":"Test order variants","run":"python3 - <<'PY'\nimport os,time,uuid,hmac,hashlib,requests\nkey=os.environ['NICEHASH_API_KEY']; secret=os.environ['NICEHASH_API_SECRET'].encode(); org=os.environ['NICEHASH_ORG_ID']\nbase='https://api2.nicehash.com'\ndef test(label,path,query):\n ts=str(int(time.time()*1000)); nonce=str(uuid.uuid4()); reqid=str(uuid.uuid4()); method='GET'\n msg='\\x00'.join([key,ts,nonce,'',org,'',method,path,query]).encode()\n sig=hmac.new(secret,msg,hashlib.sha256).hexdigest()\n headers={'X-Time':ts,'X-Nonce':nonce,'X-Auth':key+':'+sig,'X-Organization-Id':org,'X-Request-Id':reqid}\n r=requests.get(base+path+('?' + query if query else ''),headers=headers,timeout=30)\n print('\\n---',label,'---'); print('HTTP',r.status_code)\n try:\n d=r.json(); rows=d.get('list',[]) if isinstance(d,dict) else []\n print('Rows',len(rows)); print('Top-level keys',sorted(d.keys()) if isinstance(d,dict) else type(d).__name__); print('Row keys',sorted(rows[0].keys()) if rows else [])\n except Exception as e: print('JSON error',type(e).__name__)\ntest('OWN ORDER - no filters','/hashpower/api/v2/hashpower/solo/order','page=0&limit=100')\ntest('SHARED ORDER','/hashpower/api/v2/hashpower/solo/shared/order','page=0&limit=100&sortDir=ASC&sortField=createdTs&onlyGold=false')\nPY","env":{"NICEHASH_API_KEY":"${{ secrets.NICEHASH_API_KEY }}","NICEHASH_API_SECRET":"${{ secrets.NICEHASH_API_SECRET }}","NICEHASH_ORG_ID":"${{ secrets.NICEHASH_ORG_ID }}"}}]}}}
