{"name":"Test NiceHash Private API","on":{"workflow_dispatch":{}},"jobs":{"test":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.x"}},{"run":"pip install requests"},{"name":"Test rewardsOnly false","run":"python3 - <<'PY'\nimport os,time,uuid,hmac,hashlib,requests\nkey=os.environ['NICEHASH_API_KEY']; secret=os.environ['NICEHASH_API_SECRET'].encode(); org=os.environ['NICEHASH_ORG_ID']\nmethod='GET'; path='/hashpower/api/v2/hashpower/solo/order'; query='rewardsOnly=false&claimed=false&limit=100&page=0'\nts=str(int(time.time()*1000)); nonce=str(uuid.uuid4()); reqid=str(uuid.uuid4())\nmsg='\\x00'.join([key,ts,nonce,'',org,'',method,path,query]).encode()\nsig=hmac.new(secret,msg,hashlib.sha256).hexdigest()\nheaders={'X-Time':ts,'X-Nonce':nonce,'X-Auth':key+':'+sig,'X-Organization-Id':org,'X-Request-Id':reqid}\nr=requests.get('https://api2.nicehash.com'+path+'?'+query,headers=headers,timeout=30)\nprint('HTTP',r.status_code)\ntry:\n d=r.json(); rows=d.get('list',[]) if isinstance(d,dict) else []\n print('Rows',len(rows))\n print('Top-level keys',sorted(d.keys()) if isinstance(d,dict) else type(d).__name__)\n print('Row keys',sorted(rows[0].keys()) if rows else [])\nexcept Exception as e:\n print('JSON error',type(e).__name__)\nPY","env":{"NICEHASH_API_KEY":"${{ secrets.NICEHASH_API_KEY }}","NICEHASH_API_SECRET":"${{ secrets.NICEHASH_API_SECRET }}","NICEHASH_ORG_ID":"${{ secrets.NICEHASH_ORG_ID }}"}}]}}}
