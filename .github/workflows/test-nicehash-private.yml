name: Test NiceHash Private API

on:
  workflow_dispatch:
    inputs:
      print_redacted_palladium_summary:
        description: 'PUBLIC LOG: print aggregate Palladium S/M/L/Team counts + pre-entry features; no IDs, timestamps, amounts or ROI'
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - scripts/nicehash_private_readonly.py
      - scripts/collect_completed_orders.py
      - scripts/test_order_variants.py
      - scripts/match_private_orders.py
      - scripts/match_private_orders_market_context.py
      - scripts/match_private_orders_radar_context.py
      - scripts/audit_private_order_git_feed_coverage.py
      - scripts/match_private_orders_git_feed_context.py
      - tests/test_private_order_market_context.py
      - tests/test_private_git_feed_context.py
      - tests/test_private_git_feed_coverage.py
      - tests/test_private_order_radar_context.py
      - tests/test_private_order_match_diagnostics.py
      - .github/workflows/test-nicehash-private.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Admin prohibition
        run: python3 scripts/check_forbidden_admin_access.py
      - name: Enforce private API read-only policy
        run: python3 scripts/check_private_api_policy.py
      - name: Test private entry market-context logic without credentials
        run: |
          python3 -m unittest tests.test_private_order_market_context -v
          python3 -m unittest tests.test_private_order_radar_context -v
          python3 -m unittest tests.test_private_git_feed_coverage -v
          python3 -m unittest tests.test_private_git_feed_context -v
          python3 -m unittest tests.test_private_order_match_diagnostics -v

  private:
    needs: offline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Recheck Admin prohibition before credentials
        run: python3 scripts/check_forbidden_admin_access.py
      - name: Recheck private API read-only policy before credentials
        run: python3 scripts/check_private_api_policy.py
      - name: Fetch completed EasyMining orders into ephemeral runner storage
        env:
          NICEHASH_API_KEY: ${{ secrets.NICEHASH_API_KEY }}
          NICEHASH_API_SECRET: ${{ secrets.NICEHASH_API_SECRET }}
          NICEHASH_ORG_ID: ${{ secrets.NICEHASH_ORG_ID }}
          PRIVATE_EASYMINING_MAX_PAGES: '10'
        run: python3 scripts/collect_completed_orders.py
      - name: Inspect sanitized structure without private values
        run: python3 scripts/test_order_variants.py
      - name: Build entry-time HIT MISS ROI calibration without logging metrics
        run: python3 scripts/match_private_orders.py > /tmp/private-order-match.log
      - name: Audit Git buy-feed coverage for private entry gaps
        run: python3 scripts/audit_private_order_git_feed_coverage.py
      - name: Build Git buy-feed pre-entry HIT MISS context
        run: python3 scripts/match_private_orders_git_feed_context.py
      - name: Build Radar-only pre-entry context
        run: python3 scripts/match_private_orders_radar_context.py
      - name: Join entries to public market edge context
        run: python3 scripts/match_private_orders_market_context.py
      - name: Print redacted Palladium family aggregate only when explicitly requested
        if: ${{ inputs.print_redacted_palladium_summary == true }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path('/tmp/nicehash-completed-orders.json').read_text(encoding='utf-8'))
          matched = json.loads(Path('/tmp/private-order-matches.json').read_text(encoding='utf-8'))
          result = json.loads(Path('/tmp/private-order-market-context.json').read_text(encoding='utf-8'))
          radar_only = json.loads(Path('/tmp/private-order-radar-preentry.json').read_text(encoding='utf-8'))
          git_coverage = json.loads(Path('/tmp/private-order-git-feed-coverage.json').read_text(encoding='utf-8'))
          git_context = json.loads(Path('/tmp/private-order-git-feed-context.json').read_text(encoding='utf-8'))
          summary = result.get('preEntryFeatureSummary') or {}
          git_context_summary = git_context.get('summary') or {}
          radar_summary = radar_only.get('summary') or {}
          allowed = {'Palladium S', 'Palladium M', 'Palladium L', 'Team Palladium'}
          skip_by_package = {
              key: value
              for key, value in (matched.get('skipReasonsByPackage') or {}).items()
              if any(key.startswith(package + '|') for package in allowed)
          }
          skip_by_package_outcome = {
              key: value
              for key, value in (matched.get('skipReasonsByPackageOutcome') or {}).items()
              if any(key.startswith(package + '|') for package in allowed)
          }
          currency_mismatch = {
              key: value
              for key, value in (matched.get('currencyMismatchByPackageOutcome') or {}).items()
              if any(key.startswith(package + '|') for package in allowed)
          }

          def outcome(value):
              return 'HIT' if value is True else 'MISS' if value is False else 'UNKNOWN'

          collector = {}
          for row in raw.get('list') or []:
              package = row.get('packageName')
              if package not in allowed:
                  continue
              key = f"{package}|{outcome(row.get('isReward'))}"
              collector[key] = collector.get(key, 0) + 1

          matched_counts = {}
          for row in matched.get('matches') or []:
              package = row.get('packageName')
              if package not in allowed:
                  continue
              key = f"{package}|{row.get('outcome') or 'UNKNOWN'}"
              matched_counts[key] = matched_counts.get(key, 0) + 1

          def family_key(key):
              return any(key.startswith(package + '|') for package in allowed)

          radar_only_orders = {
              key: value
              for key, value in (radar_summary.get('ordersByPackageOutcome') or {}).items()
              if family_key(key)
          }
          radar_only_age_buckets = {
              key: value
              for key, value in (radar_summary.get('endpointAgeBucketsByPackageOutcome') or {}).items()
              if family_key(key)
          }
          radar_only_windows = {
              key: value
              for key, value in (radar_summary.get('byPackageHorizonOutcome') or {}).items()
              if family_key(key)
          }
          radar_only_comparisons = {
              key: value
              for key, value in (radar_summary.get('hitMinusMiss') or {}).items()
              if family_key(key)
          }
          git_feed_buckets = {
              key: value
              for key, value in (git_coverage.get('gitFeedAgeBucketsByPackageOutcome') or {}).items()
              if family_key(key)
          }
          git_feed_fresh = {
              key: value
              for key, value in (git_coverage.get('freshExactGitFeedByPackageOutcome') or {}).items()
              if family_key(key)
          }
          git_context_endpoints = {
              key: value
              for key, value in (git_context_summary.get('endpointStatusByPackageOutcome') or {}).items()
              if family_key(key)
          }
          git_context_series = {
              key: value
              for key, value in (git_context_summary.get('endpointSeriesByPackageOutcome') or {}).items()
              if family_key(key)
          }
          git_context_window_status = {
              key: value
              for key, value in (git_context_summary.get('windowStatusByPackageHorizonOutcome') or {}).items()
              if family_key(key)
          }
          git_context_windows = {
              key: value
              for key, value in (git_context_summary.get('byPackageHorizonOutcome') or {}).items()
              if family_key(key)
          }
          git_context_comparisons = {
              key: value
              for key, value in (git_context_summary.get('hitMinusMiss') or {}).items()
              if family_key(key)
          }
          git_sensitivity = git_context_summary.get('baselineToleranceSensitivity') or {}

          def sensitivity_family_key(key):
              return any(f"|{package}|" in key for package in allowed)

          git_sensitivity_status = {
              key: value
              for key, value in (git_sensitivity.get('windowStatusByTolerancePackageHorizonOutcome') or {}).items()
              if sensitivity_family_key(key)
          }
          git_sensitivity_windows = {
              key: value
              for key, value in (git_sensitivity.get('byTolerancePackageHorizonOutcome') or {}).items()
              if sensitivity_family_key(key)
          }
          git_sensitivity_comparisons = {
              key: value
              for key, value in (git_sensitivity.get('hitMinusMiss') or {}).items()
              if sensitivity_family_key(key)
          }

          by_outcome = {
              key: value
              for key, value in (summary.get('byPackageHorizonOutcome') or {}).items()
              if family_key(key)
          }
          comparisons = {
              key: value
              for key, value in (summary.get('hitMinusMiss') or {}).items()
              if family_key(key)
          }
          coverage = {
              key: value
              for key, value in (summary.get('coverageByPackageOutcomeStatus') or {}).items()
              if family_key(key)
          }
          orders = {
              key: value
              for key, value in (summary.get('ordersByPackageOutcome') or {}).items()
              if family_key(key)
          }
          payload = {
              'role': 'REDACTED_PRIVATE_PALLADIUM_FAMILY_AGGREGATE_PUBLIC_LOG',
              'containsOrderIds': False,
              'containsTimestamps': False,
              'containsAmountsOrRoi': False,
              'collectorOrdersByPackageOutcome': dict(sorted(collector.items())),
              'radarMatchedOrdersByPackageOutcome': dict(sorted(matched_counts.items())),
              'radarSkipReasonsByPackage': dict(sorted(skip_by_package.items())),
              'radarSkipReasonsByPackageOutcome': dict(sorted(skip_by_package_outcome.items())),
              'currencyMismatchByPackageOutcome': dict(sorted(currency_mismatch.items())),
              'radarOnlyOrdersByOutcome': dict(sorted(radar_only_orders.items())),
              'radarOnlyEndpointAgeBuckets': dict(sorted(radar_only_age_buckets.items())),
              'radarOnlyByPackageHorizonOutcome': dict(sorted(radar_only_windows.items())),
              'radarOnlyHitMinusMiss': dict(sorted(radar_only_comparisons.items())),
              'gitFeedAgeBucketsByPackageOutcome': dict(sorted(git_feed_buckets.items())),
              'freshExactGitFeedByPackageOutcome': dict(sorted(git_feed_fresh.items())),
              'gitFeedEndpointStatusByPackageOutcome': dict(sorted(git_context_endpoints.items())),
              'gitFeedEndpointSeriesByPackageOutcome': dict(sorted(git_context_series.items())),
              'gitFeedWindowStatusByPackageHorizonOutcome': dict(sorted(git_context_window_status.items())),
              'gitFeedByPackageHorizonOutcome': dict(sorted(git_context_windows.items())),
              'gitFeedHitMinusMiss': dict(sorted(git_context_comparisons.items())),
              'gitFeedBaselineToleranceSensitivity': {
                  'role': git_sensitivity.get('role'),
                  'primaryToleranceMinutes': git_sensitivity.get('primaryToleranceMinutes'),
                  'testedToleranceMinutes': git_sensitivity.get('testedToleranceMinutes'),
                  'windowStatusByTolerancePackageHorizonOutcome': dict(sorted(git_sensitivity_status.items())),
                  'byTolerancePackageHorizonOutcome': dict(sorted(git_sensitivity_windows.items())),
                  'hitMinusMiss': dict(sorted(git_sensitivity_comparisons.items())),
                  'canRaiseSignal': False,
              },
              'marketContextOrdersByOutcome': orders,
              'coverageByOutcomeStatus': coverage,
              'byPackageHorizonOutcome': by_outcome,
              'hitMinusMiss': comparisons,
              'canRaiseSignal': False,
          }
          print(json.dumps(payload, indent=2, allow_nan=False))
          PY
      - name: Validate ephemeral outputs without printing private results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('/tmp/nicehash-completed-orders.json'),
              Path('/tmp/private-order-matches.json'),
              Path('/tmp/private-order-git-feed-coverage.json'),
              Path('/tmp/private-order-git-feed-context.json'),
              Path('/tmp/private-order-radar-preentry.json'),
              Path('/tmp/private-order-market-context.json'),
          ):
              value = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(value, dict)
          print('PRIVATE ENTRY MARKET ANALYSIS COMPLETE')
          print('Detailed order, HIT/MISS, ROI and timestamp data were not printed or uploaded.')
          PY
      - name: Remove ephemeral private files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/nicehash-completed-orders.json
          rm -f /tmp/private-order-matches.json
          rm -f /tmp/private-order-git-feed-coverage.json
          rm -f /tmp/private-order-git-feed-context.json
          rm -f /tmp/private-order-radar-preentry.json
          rm -f /tmp/private-order-market-context.json
          rm -f /tmp/private-order-match.log
