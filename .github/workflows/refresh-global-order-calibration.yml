name: Refresh Global Order Calibration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-global-order-calibration.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-global-order-calibration
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Collect sanitized global completed orders
        env:
          NICEHASH_API_KEY: ${{ secrets.NICEHASH_API_KEY }}
          NICEHASH_API_SECRET: ${{ secrets.NICEHASH_API_SECRET }}
          NICEHASH_ORG_ID: ${{ secrets.NICEHASH_ORG_ID }}
          GLOBAL_ORDER_PAGE_SIZE: "100"
          GLOBAL_ORDER_MAX_PAGES: "20"
        run: python3 scripts/collect_global_completed_orders.py

      - name: Match global orders to Radar history
        run: python3 scripts/match_global_orders.py

      - name: Build aggregate-only global calibration report
        run: python3 scripts/build_global_order_calibration.py

      - name: Build Daily Package Stats
        run: python3 scripts/build_daily_package_stats.py

      - name: Validate privacy and shadow-only guardrails
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("calibration/global-order-calibration.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          daily_path = Path("calibration/daily-package-stats.json")
          daily = json.loads(daily_path.read_text(encoding="utf-8"))

          assert report.get("modelUse") == "NEW_CALIBRATED_SHADOW_ONLY"
          assert report.get("currentProductionModelChanged") is False

          privacy = report.get("privacy") or {}
          assert privacy.get("rawAdminOrdersStoredInPublicRepo") is False
          assert privacy.get("individualMatchedOrdersStoredInReport") is False
          assert privacy.get("reportContainsAggregatesOnly") is True

          assert "matches" not in report

          daily_privacy = daily.get("privacy") or {}
          assert daily_privacy.get("individualGlobalOrdersStored") is False
          assert daily_privacy.get("privateUserOrdersStored") is False
          assert daily_privacy.get("customerIdentifiersStored") is False
          assert daily_privacy.get("aggregateOnly") is True
          assert isinstance(daily.get("rows"), list)

          assert not Path("nicehash-global-completed-orders.json").exists()
          assert not Path("global-order-matches.json").exists()

          print("GLOBAL CALIBRATION PRIVACY GUARD OK")
          print("Confidence:", report.get("confidence"))
          print("Matched orders:", (report.get("overall") or {}).get("orders"))
          print("Hits:", (report.get("overall") or {}).get("hits"))
          print("Daily package rows:", daily.get("rowCount"))
          PY

      - name: Persist aggregate global calibration
        run: |
          git config user.name "NiceHash Radar Bot"
          git config user.email "actions@github.com"

          git add calibration/global-order-calibration.json
          git add calibration/daily-package-stats.json

          if git diff --cached --quiet; then
            echo "No global calibration changes"
            exit 0
          fi

          git commit -m "Update global calibration and daily package stats"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push race detected; rebasing on latest main (attempt $attempt/3)"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; refusing to overwrite remote changes"
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          echo "Push failed after 3 safe retries"
          exit 1
