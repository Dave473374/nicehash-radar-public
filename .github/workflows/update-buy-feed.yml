name: Update NiceHash BUY Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-buy-feed.yml'
      - 'tests/test_buy_feed_continuation.py'
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: update-nicehash-buy-feed
  # A self-dispatched successor must wait, not cancel its parent.
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-feed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Test BUY feed continuity safety
        run: python3 -m unittest discover -s tests -p 'test_buy_feed_continuation.py' -v

      - name: Fetch BUY feed
        run: curl --fail --silent --show-error --connect-timeout 10 --max-time 60 "https://nicehash-easymining-relay.david-e5e.workers.dev/buy-feed" -o buy-feed.json

      - name: Validate upstream JSON
        run: python -m json.tool buy-feed.json > /dev/null

      - name: Reject stale or unhealthy BUY feed
        env:
          MAX_FEED_AGE_SECONDS: "420"
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          feed = json.loads(Path("buy-feed.json").read_text(encoding="utf-8"))

          if feed.get("status") != "BUY FEED OK":
              raise SystemExit(f"BUY feed status is not healthy: {feed.get('status')!r}")

          if feed.get("ok") is not True:
              raise SystemExit(f"BUY feed ok flag is not true: {feed.get('ok')!r}")

          packages = feed.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("BUY feed packages are missing or empty")

          if not any(package.get("available") is True for package in packages if isinstance(package, dict)):
              raise SystemExit("BUY feed has no available=true package")

          checked_at_raw = feed.get("checked_at")
          if not isinstance(checked_at_raw, str) or not checked_at_raw.strip():
              raise SystemExit("BUY feed checked_at is missing")

          normalized = checked_at_raw.strip()
          if normalized.endswith("Z"):
              normalized = normalized[:-1] + "+00:00"

          try:
              checked_at = datetime.fromisoformat(normalized)
          except ValueError as exc:
              raise SystemExit(f"BUY feed checked_at is invalid: {checked_at_raw!r}") from exc

          if checked_at.tzinfo is None or checked_at.utcoffset() is None:
              raise SystemExit(f"BUY feed checked_at has no timezone: {checked_at_raw!r}")

          now = datetime.now(timezone.utc)
          checked_at_utc = checked_at.astimezone(timezone.utc)
          age_seconds = (now - checked_at_utc).total_seconds()
          max_age_seconds = int(os.environ["MAX_FEED_AGE_SECONDS"])

          if age_seconds < 0:
              raise SystemExit(
                  f"BUY feed checked_at is in the future by {-age_seconds:.1f}s: {checked_at_raw}"
              )

          if age_seconds > max_age_seconds:
              raise SystemExit(
                  f"STALE BUY FEED: checked_at={checked_at_raw}, "
                  f"age={age_seconds:.1f}s, limit={max_age_seconds}s"
              )

          print(
              f"BUY FEED FRESHNESS OK: checked_at={checked_at_raw}, "
              f"age={age_seconds:.1f}s, limit={max_age_seconds}s"
          )
          PY

      - name: Apply NEW calibrated shadow
        run: python3 scripts/apply_calibrated_shadow.py

      - name: Apply EDGE shadow audit
        run: python3 scripts/apply_edge_shadow.py

      - name: Apply math consistency audit
        run: python3 scripts/apply_math_consistency_shadow.py

      - name: Validate final JSON
        run: |
          python -m json.tool buy-feed.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          feed = json.loads(Path("buy-feed.json").read_text(encoding="utf-8"))
          shadow = feed.get("calibrated_shadow") or {}
          edge = feed.get("edge_shadow") or {}
          math_shadow = feed.get("math_consistency_shadow") or {}
          packages = feed.get("packages") or []

          assert shadow.get("model_use") == "NEW_CALIBRATED_SHADOW_ONLY"
          assert shadow.get("production_model") == "CURRENT"
          assert shadow.get("production_model_changed") is False
          assert edge.get("model_use") == "EDGE_SHADOW_AUDIT_ONLY"
          assert edge.get("production_model") == "CURRENT"
          assert edge.get("production_model_changed") is False
          assert math_shadow.get("model_use") == "MATH_CONSISTENCY_AUDIT_ONLY"
          assert math_shadow.get("production_model") == "CURRENT"
          assert math_shadow.get("production_model_changed") is False
          assert packages

          for package in packages:
              assert package.get("calibrated_signal") == package.get("final_signal")
              package_shadow = package.get("calibrated_shadow") or {}
              assert package_shadow.get("current_signal") == package.get("final_signal")
              assert package_shadow.get("changed_from_current") is False

              edge_shadow = package.get("edge_shadow") or {}
              assert edge_shadow.get("current_signal") == package.get("final_signal")
              assert edge_shadow.get("production_override") is False
              assert edge_shadow.get("changed_from_current") is False

              math_package = package.get("math_consistency_shadow") or {}
              assert math_package.get("production_override") is False

          print("SHADOW VALIDATION OK")
          print("Packages:", len(packages))
          print("Confidence:", shadow.get("confidence"))
          PY

      - name: Commit updated feed
        run: |
          git config user.name "NiceHash Radar Bot"
          git config user.email "actions@github.com"
          git add buy-feed.json

          if git diff --cached --quiet; then
            echo "No BUY feed changes to commit"
            exit 0
          fi

          git commit -m "Update BUY feed"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing on latest main"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; refusing to overwrite remote changes"
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          echo "Push failed after 3 attempts"
          exit 1

      - name: Schedule next BUY feed refresh
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitHub schedule events are best-effort and can be delayed or dropped.
          # Continue after transient failure, but never revive a cancelled run.
          # One running job and at most one pending successor share this group.
          # Cron remains a watchdog; this does not guarantee a five-minute SLA.
          sleep 240

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update-buy-feed.yml/dispatches" \
            --data '{"ref":"main"}'

          echo "Next BUY feed refresh dispatched."
