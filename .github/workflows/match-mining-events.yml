{
"name": "Match Mining Events",
"on": {
"workflow_dispatch": {}
},
"permissions": {
"contents": "write"
},
"jobs": {
"match": {
"runs-on": "ubuntu-latest",
"steps": [
{
"uses": "actions/checkout@v4"
},
{
"uses": "actions/setup-python@v5",
"with": {
"python-version": "3.12"
}
},
{
"name": "Match mining events to radar",
"run": "python scripts/match_mining_events.py"
},
{
"name": "Commit mining event matches",
"run": "git config user.name \"github-actions[bot]\" && git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\" && git add calibration/mining-event-matches.jsonl && git diff --cached --quiet || (git commit -m \"Update Mining Event Matches\" && git push)"
}
]
}
}
}
