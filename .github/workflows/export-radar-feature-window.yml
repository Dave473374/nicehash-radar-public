name: Export Radar Feature Window

on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC start, ISO 8601
        required: true
        default: '2026-09-17T23:00:00Z'
      end:
        description: UTC end, ISO 8601
        required: true
        default: '2026-09-18T04:00:00Z'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Export public Radar features
        run: >-
          python3 scripts/export_radar_feature_window.py
          --start '${{ inputs.start }}'
          --end '${{ inputs.end }}'
      - name: Upload public feature artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-feature-window
          path: /tmp/radar-feature-window.json
          if-no-files-found: error
          retention-days: 7
