name: Evaluate Palladium Shadow

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect Public Market History']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate_palladium_shadow.py'
      - 'tests/test_palladium_shadow_evaluation.py'
      - 'research/palladium-shadow-evaluation-plan-v1.json'
      - 'docs/palladium-shadow-evaluation-v1.md'
      - '.github/workflows/palladium-shadow-evaluation.yml'
  pull_request:
    paths:
      - 'scripts/evaluate_palladium_shadow.py'
      - 'tests/test_palladium_shadow_evaluation.py'
      - 'research/palladium-shadow-evaluation-plan-v1.json'
      - 'docs/palladium-shadow-evaluation-v1.md'
      - '.github/workflows/palladium-shadow-evaluation.yml'

permissions:
  contents: read

concurrency:
  group: palladium-shadow-evaluation-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline evaluation and unchanged experiment tests
        run: |
          python3 -m unittest tests.test_palladium_shadow_evaluation tests.test_palladium_shadow_trial tests.test_palladium_shadow_contracts -v
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 scripts/test_phase0_correctness.py
      - name: Evaluate saved public evidence without network or source writes
        run: |
          mkdir -p "$RUNNER_TEMP/palladium-evaluation"
          python3 scripts/evaluate_palladium_shadow.py \
            --output "$RUNNER_TEMP/palladium-evaluation/evaluation.json" \
            --markdown "$RUNNER_TEMP/palladium-evaluation/evaluation.md"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: palladium-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/palladium-evaluation/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: palladium-shadow-evaluation-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck checked-out code and regenerate report against a consistent checkout
        run: |
          python3 -m unittest tests.test_palladium_shadow_evaluation -v
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 scripts/evaluate_palladium_shadow.py
      - name: Commit only the two derived reports; never modify collector or frozen state
        run: |
          git config user.name 'NiceHash Radar Bot'
          git config user.email 'actions@github.com'
          git add research/palladium-shadow-evaluation.json research/palladium-shadow-evaluation.md
          python3 scripts/radar_snapshot_archive.py staged-guard
          python3 - <<'PY'
          import subprocess
          allowed={'research/palladium-shadow-evaluation.json','research/palladium-shadow-evaluation.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD']).decode().splitlines())
          assert changed <= allowed, 'Evaluator must not change experiment inputs or other files'
          PY
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update read-only Palladium shadow evaluation (no trial changes)'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            sleep $((attempt * 2))
          done
          exit 1
