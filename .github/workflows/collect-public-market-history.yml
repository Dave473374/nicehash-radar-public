name: Collect Public Market History

on:
  workflow_dispatch:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_scrypt_market_history.py'
      - 'scripts/apply_math_consistency_shadow.py'
      - 'tests/test_scrypt_market_enrichment.py'
      - 'scripts/palladium_shadow_trial.py'
      - 'tests/test_palladium_shadow_trial.py'
      - 'tests/test_palladium_shadow_contracts.py'
      - 'research/palladium-shadow-protocol-v1.json'
      - '.github/workflows/collect-public-market-history.yml'
  pull_request:
    paths:
      - 'scripts/enrich_scrypt_market_history.py'
      - 'scripts/apply_math_consistency_shadow.py'
      - 'tests/test_scrypt_market_enrichment.py'
      - 'scripts/palladium_shadow_trial.py'
      - 'tests/test_palladium_shadow_trial.py'
      - 'tests/test_palladium_shadow_contracts.py'
      - 'research/palladium-shadow-protocol-v1.json'
      - '.github/workflows/collect-public-market-history.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('public-market-pr-{0}', github.ref) || 'collect-public-market-history' }}
  cancel-in-progress: false

jobs:
  test-scrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline economics, forward-only state and archive tests
        run: |
          python3 -m unittest tests.test_scrypt_market_enrichment tests.test_palladium_shadow_trial tests.test_palladium_shadow_contracts tests.test_radar_snapshot_archive -v
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 scripts/test_phase0_correctness.py

  smoke:
    needs: test-scrypt
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only public package names, currency and availability
        run: |
          python3 - <<'PY'
          import json,os,sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from sample_public_market_burst import relay_feed
          f=relay_feed()
          packages=f.get('packages')
          if not isinstance(packages,list):raise ValueError('Public package list missing')
          inventory=[{k:p.get(k) for k in ('name','currency_market','available')} for p in packages if isinstance(p,dict)]
          counts=Counter(p.get('name') for p in inventory)
          r={'source':'EXISTING_PUBLIC_RELAY','checkedAt':f.get('checked_at'),'relayVersion':f.get('relay_version'),
             'feedStatus':f.get('status'),'packageCount':len(inventory),'packages':inventory,
             'palladiumNameCounts':{name:counts[name] for name in ('Palladium S','Palladium M')}}
          out=Path(os.environ['RUNNER_TEMP'])/'palladium-shadow-smoke'
          out.mkdir(parents=True,exist_ok=True)
          (out/'public-package-inventory.json').write_text(json.dumps(r,indent=2)+'\n')
          print('EXACT PUBLIC PACKAGE INVENTORY:',json.dumps(r))
          PY
      - name: Three real minute-spaced public samples, explicitly excluded from the trial
        run: |
          python3 scripts/palladium_shadow_trial.py collect --smoke --samples 3 --output-dir "$RUNNER_TEMP/palladium-shadow-smoke"
          git diff --exit-code
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'palladium-shadow-smoke/report.json').read_text())
          assert r['evidenceRole']=='PR_SMOKE_EXCLUDED_FROM_TRIAL'
          assert r['canRaiseSignal'] is False and r['canSendNotifications'] is False
          assert r['lastBatch']['collected']==3, 'Public smoke incomplete; no production activation'
          print('REAL PUBLIC SMOKE:',json.dumps(r['packages']))
          assert all(r['packages'][name]['validSamples']>=2 for name in ('Palladium S','Palladium M')), 'HTTP success is not usable Palladium data; activation not verified'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palladium-shadow-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/palladium-shadow-smoke/
          retention-days: 7
          if-no-files-found: warn

  collect:
    needs: test-scrypt
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine finite trial phase without resetting activation
        id: phase
        run: python3 scripts/palladium_shadow_trial.py plan
      - name: Collect minute-spaced trial batch through the existing public sampler
        if: steps.phase.outputs.mode == 'trial'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          samples=31
          if [ "$EVENT_NAME" = 'push' ]; then samples=6; fi
          python3 scripts/palladium_shadow_trial.py collect --samples "$samples" --output-dir "$RUNNER_TEMP/palladium-shadow-batch"
      - name: Read fresh quote from existing public relay (normal collector after trial expiry)
        if: steps.phase.outputs.mode == 'legacy'
        continue-on-error: true
        run: |
          target="$RUNNER_TEMP/scrypt-public-feed.json"
          rm -f "$target"
          if ! curl --fail --silent --show-error --proto '=https' --max-time 30 --max-filesize 4000000 \
            "https://nicehash-easymining-relay.david-e5e.workers.dev/buy-feed" -o "$target"; then
            rm -f "$target"
            exit 1
          fi
      - name: Collect normal public NiceHash snapshot after trial expiry
        if: steps.phase.outputs.mode == 'legacy'
        run: python3 scripts/collect_public_market_history.py
      - name: Enrich normal snapshot after trial expiry
        if: steps.phase.outputs.mode == 'legacy'
        continue-on-error: true
        run: python3 scripts/enrich_scrypt_market_history.py --feed "$RUNNER_TEMP/scrypt-public-feed.json"
      - name: Stop suspended trial without repeated forbidden or rate-limited requests
        if: steps.phase.outputs.mode == 'suspended'
        run: |
          echo 'Trial suspended by HTTP safety policy; inspect persisted report before resuming.'
          exit 1
      - name: Verify public-only provenance and no signal promotion
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('calibration/public-market-history.jsonl')
          rows=[json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert rows
          latest=rows[-1]
          assert latest.get('source')=='NICEHASH_PUBLIC_MARKET'
          assert all(latest.get(k) is False for k in ('credentials_used','private_api_used','admin_api_used'))
          assert isinstance(latest.get('algorithms'),dict)
          report=json.loads(Path('research/palladium-shadow-report.json').read_text())
          assert all(report[k] is False for k in ('canRaiseSignal','canSendNotifications','automaticPurchase','currentProductionModelChanged'))
          print('PUBLIC ONLY; SHADOW ONLY; CURRENT unchanged')
          PY
      - name: Stage verified compressed trial history
        if: steps.phase.outputs.mode == 'trial'
        run: python3 scripts/palladium_shadow_trial.py stage
      - name: Persist one batch, never one Git commit per minute
        run: |
          git config user.name 'NiceHash Radar Bot'
          git config user.email 'actions@github.com'
          git add calibration/public-market-history.jsonl research/scrypt-economics-latest.json
          git add research/palladium-shadow-state.json research/palladium-shadow-report.json
          python3 scripts/radar_snapshot_archive.py staged-guard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record bounded public-market shadow trial batch (no signals)'
          for attempt in 1 2 3; do
            if git push origin HEAD:main > "$RUNNER_TEMP/public-push.log" 2>&1; then
              cat "$RUNNER_TEMP/public-push.log"
              exit 0
            fi
            cat "$RUNNER_TEMP/public-push.log"
            if grep -Eq 'GH001|exceeds.*file size limit|Large files detected' "$RUNNER_TEMP/public-push.log"; then exit 1; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            sleep $((attempt*2))
          done
          exit 1
      - name: Report incomplete acquisition only after preserving available evidence
        if: steps.phase.outputs.mode == 'trial'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/palladium-shadow-report.json').read_text())
          print('PERSISTED FORWARD TRIAL:',json.dumps(r['lastBatch']))
          if r['status']=='SUSPENDED_HTTP_POLICY':raise SystemExit('Trial suspended; no automatic retry of blocked endpoint')
          if not r['lastBatch']['complete'] and r['status']!='COMPLETED':raise SystemExit('Incomplete public acquisition; evidence retained')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palladium-shadow-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/palladium-shadow-batch/
          retention-days: 7
          if-no-files-found: ignore
