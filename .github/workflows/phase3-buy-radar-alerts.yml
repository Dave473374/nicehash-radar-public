name: Phase 3 BUY Radar Alerts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update NiceHash BUY Feed"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: phase3-buy-radar-alerts
  cancel-in-progress: false

jobs:
  alerts:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build alert events
        run: python3 scripts/build_alert_events.py

      - name: Emit actionable GitHub notices
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/buy-radar-alerts.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          def signed(value, digits=1):
              if isinstance(value, (int, float)):
                  return f"{value:+.{digits}f}%"
              return "n/a"

          def plain(value, digits=1):
              if isinstance(value, (int, float)):
                  return f"{value:.{digits}f}"
              return "n/a"

          def gh_escape(value):
              return (
                  str(value)
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          signal_icon = {
              "GOOD": "🟢",
              "BUY NOW": "🔥",
              "STRONG BUY": "🚨",
          }

          for event in data.get("events") or []:
              signal = event.get("signal")
              icon = signal_icon.get(signal, "🔔")
              title = f"{icon} {event.get('package')} — {signal}"

              edge = event.get("edgeShadow") or {}
              market = event.get("publicMarket") or {}
              freshness = event.get("freshness") or {}

              edge_label = edge.get("label") or "UNKNOWN"
              edge_score = edge.get("score")
              edge_text = (
                  f"{edge_label} {edge_score:+.2f}"
                  if isinstance(edge_score, (int, float))
                  else edge_label
              )

              market_status = market.get("status") or "UNAVAILABLE"
              if market_status == "READY":
                  market_text = (
                      f"MARKET: READY · price {signed(market.get('priceVs24hMedianPercent'))} · "
                      f"orders {signed(market.get('ordersVs24hMedianPercent'))}"
                  )
              elif market_status == "WARMING_UP":
                  market_text = (
                      f"MARKET: WARMING UP · {market.get('orders')} orders"
                  )
              else:
                  market_text = f"MARKET: {market_status}"

              age = freshness.get("ageMinutes")
              fresh_status = freshness.get("status") or "UNKNOWN"
              if isinstance(age, (int, float)):
                  freshness_text = f"{fresh_status} · {age:.1f}m old"
              else:
                  freshness_text = fresh_status

              message = "\n".join([
                  (
                      f"EV {plain(event.get('expectedReturnPercent'))}% · "
                      f"Q24 {signed(event.get('qualityVs24hPercent'))} · "
                      f"Q7 {signed(event.get('qualityVs7dPercent'))}"
                  ),
                  f"EDGE: {edge_text}",
                  market_text,
                  (
                      f"Odds: {event.get('nicehashOdds') or 'n/a'} · "
                      f"Data: {freshness_text}"
                  ),
              ])

              print(
                  f"::notice title={gh_escape(title)}::{gh_escape(message)}"
              )

          print("Alert events:", data.get("eventCount", 0))
          PY

      - name: Persist alert state and history
        run: |
          git config user.name "NiceHash Radar Bot"
          git config user.email "actions@github.com"

          git add alerts/alert-state.json
          if [ -f alerts/alert-history.jsonl ]; then
            git add alerts/alert-history.jsonl
          fi

          if git diff --cached --quiet; then
            echo "No alert state changes"
            exit 0
          fi

          git commit -m "Update BUY Radar alert state"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push race detected; rebasing on latest main (attempt $attempt/3)"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; refusing to overwrite remote changes"
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 2))
          done

          echo "Push failed after 3 safe retries"
          exit 1
