name: Radar Archive Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/radar-archive-integrity.yml'
      - 'scripts/*archive*.py'
      - 'tests/*archive*.py'

permissions:
  contents: read

jobs:
  archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory public archive consumers and create lossless offline fixture
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, zipfile
          from pathlib import Path
          out=Path('/tmp/radar-archive-audit')
          out.mkdir()
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          code=[Path(p) for p in tracked if p and Path(p).suffix in ('.py','.yml','.yaml')]
          refs=[]
          for p in code:
              for n,line in enumerate(p.read_text().splitlines(),1):
                  if 'radar-snapshots' in line:
                      refs.append({'path':str(p),'line':n,'text':line.strip()})
          data=[Path('calibration/radar-snapshots.jsonl'),Path('calibration/public-market-history.jsonl'),Path('buy-feed.json')]
          files=[p for p in code+data if p.is_file()]
          manifest={'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'references':refs,'files':{}}
          with zipfile.ZipFile(out/'public-migration-fixture.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in files:
                  raw=p.read_bytes()
                  manifest['files'][str(p)]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
                  z.writestr(str(p),raw)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radar-archive-audit-${{ github.run_id }}
          path: /tmp/radar-archive-audit/
          retention-days: 7
          if-no-files-found: error
