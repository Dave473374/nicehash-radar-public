{
"name": "Build Mining Events",
"on": {
"workflow_dispatch": {},
"schedule": [
{
"cron": "2-59/5 * * * *"
}
]
},
"permissions": {
"contents": "write"
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"uses": "actions/checkout@v4"
},
{
"uses": "actions/setup-python@v5",
"with": {
"python-version": "3.12"
}
},
{
"name": "Build mining events",
"run": "python build_mining_events.py"
},
{
"name": "Commit mining events",
"run": "git config user.name \"github-actions[bot]\" && git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\" && git add mining-events.json && git diff --cached --quiet || (git commit -m \"Update Mining Events\" && git push)"
}
]
}
}
}
