name: Update Recent Blocks

on:
workflow_dispatch:
schedule:
- cron: "*/5 * * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: "3.12"

- name: Fetch NiceHash recent blocks
run: python fetch_recent_blocks.py

- name: Commit updated data
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add recent-blocks.json
git diff --cached --quiet || git commit -m "Update Recent Blocks"
git push
