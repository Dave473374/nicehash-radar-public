name: BUY Radar Recovery Verification
on:
  workflow_dispatch:
  push:
    branches: [recovery/buy-radar-20261005]
    paths:
      - '.github/workflows/buy-radar-recovery.yml'
      - '.github/workflows/update-buy-feed.yml'
      - 'workers/recovery/**'
      - 'scripts/recovery_health.py'
      - 'tests/test_recovery*'
      - 'tests/test_buy_feed_continuation.py'
permissions:
  contents: write
concurrency:
  group: buy-radar-recovery-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            workers/recovery
            tests
            scripts
            docs
      - name: Build and run mandatory offline recovery tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-test-results
          python3 workers/recovery/build_worker.py | tee /tmp/recovery-test-results/build.log
          node --test workers/recovery/test_history.mjs 2>&1 | tee /tmp/recovery-test-results/node.log
          python3 -m unittest discover -s tests -p 'test_recovery_health.py' -v 2>&1 | tee /tmp/recovery-test-results/health-alerts.log
          python3 -m unittest discover -s tests -p 'test_buy_feed_continuation.py' -v 2>&1 | tee /tmp/recovery-test-results/pipeline.log
      - name: Inspect public live history and feed once
        run: |
          python3 - <<'PY'
          import datetime, json, urllib.request
          from pathlib import Path
          now = datetime.datetime.now(datetime.timezone.utc)
          report = {'observed_at': now.isoformat(), 'automatic_purchase': False, 'cloudflare_deployed_by_this_workflow': False}
          base = 'https://nicehash-easymining-relay.david-e5e.workers.dev'
          for endpoint in ('history', 'buy-feed'):
              try:
                  req = urllib.request.Request(base + '/' + endpoint, headers={'Accept': 'application/json', 'User-Agent': 'BUY-Radar-Recovery-Diagnostic'})
                  with urllib.request.urlopen(req, timeout=40) as response:
                      raw = response.read(2000000)
                  data = json.loads(raw)
                  Path('/tmp/recovery-' + endpoint + '.json').write_text(json.dumps(data, indent=2))
                  keys = ('status', 'ok', 'relay_version', 'checked_at', 'snapshot_count_listed', 'list_complete', 'recent_snapshot_keys', 'history_samples_loaded', 'history_hourly_samples', 'history_coverage_hours', 'trend_engine_status', 'history_status', 'history_error')
                  compact = {k: data[k] for k in keys if k in data}
                  if endpoint == 'buy-feed':
                      compact['packages'] = [{'name': p.get('name'), 'signal': p.get('final_signal'), 'samples24': (p.get('history_trend') or {}).get('sample_count_24h'), 'q24': (p.get('history_trend') or {}).get('expected_blocks_per_btc_vs_24h_percent'), 'q7': (p.get('history_trend') or {}).get('expected_blocks_per_btc_vs_7d_percent'), 'reason': p.get('final_signal_reason') or (p.get('decision') or {}).get('rationale')} for p in data.get('packages', [])]
                  report[endpoint] = compact
              except Exception as exc:
                  report[endpoint] = {'access_error': str(exc)}
          Path('/tmp/recovery-live-report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Version generated deployment source on recovery branch only
        if: github.ref == 'refs/heads/recovery/buy-radar-20261005'
        run: |
          set -euo pipefail
          git config user.name "NiceHash Recovery Builder"
          git config user.email "actions@github.com"
          git add workers/recovery/worker.js workers/recovery/base-worker-v2.9.0.js workers/recovery/build-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: record tested Worker source and build provenance"
          git push origin HEAD:refs/heads/recovery/buy-radar-20261005
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buy-radar-recovery-test-results
          path: /tmp/recovery-test-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: buy-radar-recovery-evidence
          path: /tmp/recovery-*.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: buy-radar-tested-worker
          path: |
            workers/recovery/worker.js
            workers/recovery/base-worker-v2.9.0.js
            workers/recovery/build-manifest.json
            workers/recovery/build_worker.py
            workers/recovery/history-functions.js
            workers/recovery/test_history.mjs
            workers/recovery/base-worker-v2.9.0.js.gz
          retention-days: 14
