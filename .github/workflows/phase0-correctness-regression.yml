name: Phase 0 Correctness Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "scripts/build_alert_events.py"
      - "scripts/match_private_orders.py"
      - "scripts/collect_completed_orders.py"
      - "scripts/match_global_orders.py"
      - "scripts/build_global_order_calibration.py"
      - "scripts/build_daily_package_stats.py"
      - "tests/test_reward_order_semantics.py"
      - "docs/reward-order-semantics.md"
      - "tests/test_private_payout_integrity.py"
      - "scripts/match_mining_events.py"
      - "scripts/collect_calibration.py"
      - "tests/test_reward_context_integrity.py"
      - "scripts/apply_math_consistency_shadow.py"
      - "scripts/nicehash_private_readonly.py"
      - "scripts/collect_shared_packages.py"
      - "scripts/build_evidence_scorecard.py"
      - "scripts/build_calibration_report.py"
      - "scripts/evaluate_prospective_candidate_v1.py"
      - "research/palladium-s-momentum-candidate-v1.json"
      - "research/research-signal-register.json"
      - "docs/research-signal-register.md"
      - "scripts/validate_research_signal_register.py"
      - "tests/test_research_signal_register.py"
      - "tests/test_prospective_candidate_v1.py"
      - "tests/test_workflow_publish_safety.py"
      - "scripts/test_phase0_correctness.py"
      - ".github/workflows/phase0-correctness-regression.yml"
      - ".github/workflows/update-buy-feed.yml"
      - ".github/workflows/recent-blocks.yml"
      - ".github/workflows/match-mining-events.yml"
      - ".github/workflows/phase3-buy-radar-alerts.yml"
      - ".github/workflows/validate-buy-radar-evidence.yml"
      - ".github/workflows/test-nicehash-private.yml"
      - ".github/workflows/collect-shared-packages.yml"

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile correctness-critical Python
        run: |
          python3 -m py_compile \
            scripts/build_alert_events.py \
            scripts/match_private_orders.py \
            scripts/match_global_orders.py \
            scripts/build_global_order_calibration.py \
            scripts/build_daily_package_stats.py \
            scripts/collect_completed_orders.py \
            scripts/match_mining_events.py \
            scripts/apply_math_consistency_shadow.py \
            scripts/nicehash_private_readonly.py \
            scripts/collect_shared_packages.py \
            scripts/build_evidence_scorecard.py \
            scripts/build_calibration_report.py \
            scripts/evaluate_prospective_candidate_v1.py \
            scripts/validate_research_signal_register.py \
            tests/test_research_signal_register.py \
            tests/test_reward_order_semantics.py \
            tests/test_prospective_candidate_v1.py \
            scripts/test_phase0_correctness.py

      - name: Smoke-test calibration report build
        run: python3 scripts/build_calibration_report.py > /tmp/calibration-report-smoke.log

      - name: Test workflow publishing against isolated local Git remotes
        run: python3 -m unittest discover -s tests -p 'test_workflow_publish_safety.py' -v

      - name: Test source freshness and reward-context integrity
        run: python3 -m unittest discover -s tests -p 'test_reward_context_integrity.py' -v

      - name: Smoke-test reward matching on existing public history
        run: |
          MINING_EVENT_MATCH_OUTPUT=/tmp/reward-context-smoke.jsonl python3 scripts/match_mining_events.py
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('/tmp/reward-context-smoke.jsonl').read_text().splitlines() if line.strip()]
          matched = [r for r in rows if r.get('radar_matched') is True]
          assert rows and matched, 'Public-history smoke must contain real matches'
          assert all(r.get('entry_time_eligible') is False and r.get('can_supply_miss_denominator') is False for r in rows)
          assert all(0 <= r['snapshot_feed_age_seconds'] <= 900 for r in matched)
          print('Public-history rows:', len(rows), 'fresh reward-context matches:', len(matched))
          PYCODE

      - name: Test private payout completeness without credentials
        run: python3 -m unittest discover -s tests -p 'test_private_payout_integrity.py' -v

      - name: Test reward-event versus winning-order semantics
        run: python3 -m unittest tests.test_reward_order_semantics -v

      - name: Test frozen prospective candidate v1
        run: python3 -m unittest tests.test_prospective_candidate_v1 -v

      - name: Validate research signal register
        run: |
          python3 scripts/validate_research_signal_register.py
          python3 -m unittest tests.test_research_signal_register -v

      - name: Run Phase 0 regression scenarios
        run: python3 scripts/test_phase0_correctness.py
      - name: Enforce Admin prohibition
        run: python3 scripts/check_forbidden_admin_access.py
      - name: Enforce private API read-only policy
        run: python3 scripts/check_private_api_policy.py
