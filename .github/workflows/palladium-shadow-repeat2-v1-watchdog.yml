name: Palladium Shadow v1 Repeat2 Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * 2-5 10 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: palladium-shadow-repeat2-v1-main
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check persisted repeat2 freshness
        id: watch
        run: python3 scripts/palladium_shadow_repeat2_v1.py watchdog
      - name: Dispatch collector only when stale or activation is missing
        if: steps.watch.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/palladium-shadow-repeat2-v1.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Recovery dispatch sent: ${{ steps.watch.outputs.reason }}"
