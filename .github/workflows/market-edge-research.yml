name: Public Market Edge Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/build_market_edge_research.py
      - tests/test_market_edge_research.py
      - .github/workflows/market-edge-research.yml
      - docs/market-edge-research.md
      - docs/math-market-input-findings.md
      - scripts/apply_math_consistency_shadow.py
      - scripts/collect_public_market_history.py
      - scripts/diagnose_market_inputs.py
      - tests/test_market_input_diagnostics.py
      - scripts/build_lag_episodes.py
      - tests/test_market_lag_episodes.py
      - tests/test_market_lag_integrity.py
      - scripts/build_alert_latency_report.py
      - tests/test_market_alert_latency.py
      - scripts/build_verified_hit_market_context.py
      - tests/test_verified_hit_market_context.py
      - docs/verified-hit-market-context.md
      - research/onchain-hit-verification.jsonl
      - docs/alert-latency-policy.md
      - docs/lag-evidence-integrity.md
      - research/lag-protocol-v1.json
      - docs/lag-episodes-v1.md
  pull_request:
    branches: [main]
    paths:
      - scripts/build_market_edge_research.py
      - tests/test_market_edge_research.py
      - .github/workflows/market-edge-research.yml
      - docs/market-edge-research.md
      - docs/math-market-input-findings.md
      - scripts/apply_math_consistency_shadow.py
      - scripts/collect_public_market_history.py
      - scripts/diagnose_market_inputs.py
      - tests/test_market_input_diagnostics.py
      - scripts/build_lag_episodes.py
      - tests/test_market_lag_episodes.py
      - tests/test_market_lag_integrity.py
      - scripts/build_alert_latency_report.py
      - tests/test_market_alert_latency.py
      - scripts/build_verified_hit_market_context.py
      - tests/test_verified_hit_market_context.py
      - docs/verified-hit-market-context.md
      - research/onchain-hit-verification.jsonl
      - docs/alert-latency-policy.md
      - docs/lag-evidence-integrity.md
      - research/lag-protocol-v1.json
      - docs/lag-episodes-v1.md

permissions:
  contents: read

concurrency:
  group: market-edge-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing safety policies
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
      - name: Test research and Phase 0 without network or account credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_market*.py' -v
          python3 scripts/test_phase0_correctness.py
      - name: Analyze existing public files only
        run: |
          python3 scripts/build_market_edge_research.py \
            --output /tmp/market-edge-report.json \
            --pairs /tmp/market-edge-pairs.jsonl
          python3 scripts/diagnose_market_inputs.py --output /tmp/input-diagnostics.json
          python3 scripts/build_lag_episodes.py \
            --pairs /tmp/market-edge-pairs.jsonl \
            --previous-controls research/lag-controls.jsonl --controls /tmp/lag-controls.jsonl \
            --episodes /tmp/lag-episodes.jsonl --output /tmp/lag-report.json
          python3 scripts/build_alert_latency_report.py --output /tmp/alert-latency-report.json
          python3 scripts/build_verified_hit_market_context.py \
            --output /tmp/verified-hit-market-context.jsonl \
            --report /tmp/verified-hit-market-context-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-edge-research-${{ github.run_id }}
          path: |
            /tmp/market-edge-report.json
            /tmp/market-edge-pairs.jsonl
            /tmp/input-diagnostics.json
            /tmp/lag-episodes.jsonl
            /tmp/lag-controls.jsonl
            /tmp/lag-report.json
            /tmp/alert-latency-report.json
            /tmp/verified-hit-market-context.jsonl
            /tmp/verified-hit-market-context-report.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: market-edge-research-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact checked-out code before research
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 -m unittest discover -s tests -p 'test_market*.py'
      - name: Build report without changing source feeds
        run: |
          python3 scripts/build_market_edge_research.py
          python3 scripts/diagnose_market_inputs.py
          python3 scripts/build_lag_episodes.py
          python3 scripts/build_alert_latency_report.py
          python3 scripts/build_verified_hit_market_context.py
      - name: Persist only public research outputs
        run: |
          git config user.name 'NiceHash Radar Bot'
          git config user.email 'actions@github.com'
          git add research/market-edge-report.json research/market-edge-pairs.jsonl research/input-diagnostics.json research/lag-episodes.jsonl research/lag-controls.jsonl research/lag-report.json research/alert-latency-report.json research/verified-hit-market-context.jsonl research/verified-hit-market-context-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update public market research (no decision changes)'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
