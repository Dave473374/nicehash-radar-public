name: Public Market Edge Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/build_market_edge_research.py
      - tests/test_market_edge_research.py
      - .github/workflows/market-edge-research.yml
      - docs/market-edge-research.md
      - docs/math-market-input-findings.md
      - scripts/apply_math_consistency_shadow.py
      - scripts/collect_public_market_history.py
      - scripts/diagnose_market_inputs.py
      - tests/test_market_input_diagnostics.py
      - scripts/build_lag_episodes.py
      - tests/test_market_lag_episodes.py
      - tests/test_market_lag_integrity.py
      - scripts/build_alert_latency_report.py
      - tests/test_market_alert_latency.py
      - scripts/build_verified_hit_market_context.py
      - tests/test_verified_hit_market_context.py
      - docs/verified-hit-market-context.md
      - scripts/build_palladium_hit_control_comparison.py
      - tests/test_market_palladium_hit_controls.py
      - scripts/palladium_m_intraday.py
      - tests/test_palladium_m_intraday.py
      - scripts/palladium_quote_repetition.py
      - tests/test_palladium_quote_repetition.py
      - scripts/sample_public_market_burst.py
      - tests/test_public_market_burst.py
      - docs/palladium-hit-controls.md
      - research/onchain-hit-verification.jsonl
      - docs/alert-latency-policy.md
      - docs/lag-evidence-integrity.md
      - research/lag-protocol-v1.json
      - docs/lag-episodes-v1.md
  pull_request:
    branches: [main]
    paths:
      - scripts/build_market_edge_research.py
      - tests/test_market_edge_research.py
      - .github/workflows/market-edge-research.yml
      - docs/market-edge-research.md
      - docs/math-market-input-findings.md
      - scripts/apply_math_consistency_shadow.py
      - scripts/collect_public_market_history.py
      - scripts/diagnose_market_inputs.py
      - tests/test_market_input_diagnostics.py
      - scripts/build_lag_episodes.py
      - tests/test_market_lag_episodes.py
      - tests/test_market_lag_integrity.py
      - scripts/build_alert_latency_report.py
      - tests/test_market_alert_latency.py
      - scripts/build_verified_hit_market_context.py
      - tests/test_verified_hit_market_context.py
      - docs/verified-hit-market-context.md
      - scripts/build_palladium_hit_control_comparison.py
      - tests/test_market_palladium_hit_controls.py
      - scripts/palladium_m_intraday.py
      - tests/test_palladium_m_intraday.py
      - scripts/palladium_quote_repetition.py
      - tests/test_palladium_quote_repetition.py
      - scripts/sample_public_market_burst.py
      - tests/test_public_market_burst.py
      - docs/palladium-hit-controls.md
      - research/onchain-hit-verification.jsonl
      - docs/alert-latency-policy.md
      - docs/lag-evidence-integrity.md
      - research/lag-protocol-v1.json
      - docs/lag-episodes-v1.md

permissions:
  contents: read

concurrency:
  group: market-edge-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing safety policies
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
      - name: Test research and Phase 0 without network or account credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_market*.py' -v
          python3 -m unittest tests.test_verified_hit_market_context -v
          python3 -m unittest tests.test_palladium_m_intraday tests.test_palladium_quote_repetition tests.test_public_market_burst -v
          python3 scripts/test_phase0_correctness.py
      - name: Analyze existing public files only
        run: |
          python3 scripts/build_market_edge_research.py \
            --output /tmp/market-edge-report.json \
            --pairs /tmp/market-edge-pairs.jsonl
          python3 scripts/diagnose_market_inputs.py --output /tmp/input-diagnostics.json
          python3 scripts/build_lag_episodes.py \
            --pairs /tmp/market-edge-pairs.jsonl \
            --previous-controls research/lag-controls.jsonl --controls /tmp/lag-controls.jsonl \
            --episodes /tmp/lag-episodes.jsonl --output /tmp/lag-report.json
          python3 scripts/build_alert_latency_report.py --output /tmp/alert-latency-report.json
          python3 scripts/build_verified_hit_market_context.py \
            --pairs /tmp/market-edge-pairs.jsonl \
            --episodes /tmp/lag-episodes.jsonl \
            --output /tmp/verified-hit-market-context.jsonl \
            --report /tmp/verified-hit-market-context-report.json
          python3 scripts/build_palladium_hit_control_comparison.py \
            --hits /tmp/verified-hit-market-context.jsonl \
            --pairs /tmp/market-edge-pairs.jsonl \
            --output /tmp/palladium-hit-control-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-edge-research-${{ github.run_id }}
          path: |
            /tmp/market-edge-report.json
            /tmp/market-edge-pairs.jsonl
            /tmp/input-diagnostics.json
            /tmp/lag-episodes.jsonl
            /tmp/lag-controls.jsonl
            /tmp/lag-report.json
            /tmp/alert-latency-report.json
            /tmp/verified-hit-market-context.jsonl
            /tmp/verified-hit-market-context-report.json
            /tmp/palladium-hit-control-report.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: market-edge-research-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact checked-out code before research
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 -m unittest discover -s tests -p 'test_market*.py'
          python3 -m unittest tests.test_verified_hit_market_context
          python3 -m unittest tests.test_palladium_m_intraday tests.test_palladium_quote_repetition tests.test_public_market_burst
      - name: Build report without changing source feeds
        run: |
          python3 scripts/build_market_edge_research.py
          python3 scripts/diagnose_market_inputs.py
          python3 scripts/build_lag_episodes.py
          python3 scripts/build_alert_latency_report.py
          python3 scripts/build_verified_hit_market_context.py
          python3 scripts/build_palladium_hit_control_comparison.py
      - name: Persist only public research outputs
        run: |
          git config user.name 'NiceHash Radar Bot'
          git config user.email 'actions@github.com'
          git add research/market-edge-report.json research/market-edge-pairs.jsonl research/input-diagnostics.json research/lag-episodes.jsonl research/lag-controls.jsonl research/lag-report.json research/alert-latency-report.json research/verified-hit-market-context.jsonl research/verified-hit-market-context-report.json research/palladium-hit-control-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update public market research (no decision changes)'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1

  intraday-diagnostic:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only research boundaries and synthetic tests
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 -m unittest tests.test_palladium_m_intraday tests.test_palladium_quote_repetition -v
      - name: Inspect complete public Git windows and test fixed repetition screen
        run: |
          python3 - <<'PY'
          from datetime import date, timedelta
          import subprocess
          days=[str(date(2026,9,5)+timedelta(days=n)) for n in range(21)]
          with open('/tmp/palladium-m-intraday.log','w') as log:
              subprocess.run(['python3','scripts/palladium_m_intraday.py','--dates',*days],stdout=log,check=True)
          PY
          python3 scripts/palladium_quote_repetition.py
      - name: Print archive coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/palladium-m-intraday-report.json').read_text())
          print('FULL HISTORY COUNTS',json.dumps(r['counts']))
          print('GIT HEAD',r['gitHead'])
          print('MANIFEST',r['candidateManifestSha256'])
          print('TOTAL TARGET-DAY QUOTES',r['quoteCount'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palladium-m-intraday-${{ github.run_id }}
          path: |
            /tmp/palladium-m-intraday-report.json
            /tmp/palladium-m-git-quotes.jsonl
            /tmp/palladium-m-repetition-report.json
          retention-days: 30
          if-no-files-found: error

  minute-cadence-diagnostic:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: public-market-minute-cadence-diagnostic
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public-only policy and offline sampling tests
        run: |
          python3 scripts/check_forbidden_admin_access.py
          python3 scripts/check_private_api_policy.py
          python3 -m unittest tests.test_public_market_burst -v
      - name: Six bounded public samples at one-minute intervals (no cron or writes)
        run: python3 scripts/sample_public_market_burst.py --samples 6 --interval 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-market-minute-burst-${{ github.run_id }}
          path: /tmp/public-market-burst/
          retention-days: 30
          if-no-files-found: warn
